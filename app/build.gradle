apply plugin: 'com.android.application'

android {
    namespace "com.touchbridge.vpn"
    compileSdkVersion 35

    defaultConfig {
        applicationId "com.touchbridge.vpn"
        minSdkVersion 26
        targetSdkVersion 35
        versionCode 1
        versionName "1.0"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    lintOptions {
        abortOnError false
        checkReleaseBuilds false
    }
}
